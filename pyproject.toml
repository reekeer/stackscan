[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stackscan"
description = "Full web stack, infrastructure, DNS, port, subdomain and CVE analyzer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]

authors = [
  { name = "reekeer team" }
]
maintainers = [
  { name = "delewer" }
]

dependencies = [
  "rich>=13.7",
  "aiohttp>=3.9",
  "dnspython>=2.6",
  "python-nmap>=0.7",
  "sigdb>=1.0.2"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

keywords = [
  "wappalyzer",
  "stack",
  "osint",
  "fingerprinting",
  "tech",
  "cli"
]

[project.optional-dependencies]
geo = [
  "geoip2>=4.8"
]
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "twine>=5.0",
  "build>=1.0",
  "geoip2>=4.8"
]

[project.urls]
Source = "https://github.com/reekeer/stackscan"
Issues = "https://github.com/reekeer/stackscan/issues"

[project.scripts]
stackscan = "stackscan.cli:main"

# Mounts stackscan inside the reekeer shell as /recon/stackscan.
#
# Not `/tools/recon`: a root that holds every plugin distinguishes none of them, so the category is
# the top-level group.
#
# Name, version, description, authors and dependencies are read from [project] above, so nothing is
# repeated here. No arguments are declared on purpose: stackscan's own argparse keeps ownership of all
# of them, including `--help` and the `sigdb` subcommand, and reekeer hands it the raw tokens.
[tool.reekeer]
group = "/recon"
entrypoint = "stackscan.cli:main"
python-root = "src"
aliases = ["ss"]

[tool.hatch.version]
path = "src/stackscan/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/stackscan"]
artifacts = [
  "src/stackscan/data/*.sigdb",
  "src/stackscan/data/*.json.gz",
  "src/stackscan/data/*.txt",
  "src/stackscan/data/*.png",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/stackscan",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
]
artifacts = [
  "src/stackscan/data/*.sigdb",
  "src/stackscan/data/*.json.gz",
  "src/stackscan/data/*.txt",
  "src/stackscan/data/*.png",
]

[tool.black]
line-length = 100
target-version = ["py311"]

include = '\.pyi?$'
exclude = '/(\.git|\.venv|venv|build|dist|__pycache__)/'

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N"
]
ignore = [
  "E501"
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

include = ["src"]
exclude = [
  "node_modules",
  "**/__pycache__",
  "build",
  "dist",
  ".*",
  ".venv",
  "src/stackscan/export.py"
]

reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportGeneralTypeIssues = true
