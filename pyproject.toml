[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stackscan"
description = "Stackscan - lightweight Wappalyzer-like stack detector."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]

authors = [
  { name = "reekeer team" }
]
maintainers = [
  { name = "delewer", email = "del@reekeer.hidden" }
]

dependencies = [
  "rich>=13.7",
  "pydantic>=2.0",
  "aiohttp>=3.9"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

keywords = [
  "wappalyzer",
  "stack",
  "osint",
  "fingerprinting",
  "tech",
  "cli"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "pyright>=1.1"
]

[project.urls]
Source = "https://github.com/reekeer/stackscan"
Issues = "https://github.com/reekeer/stackscan/issues"

[project.scripts]
stackscan = "stackscan.cli:main"


[tool.hatch.version]
path = "src/stackscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stackscan"]

[tool.hatch.envs.default]
dependencies = [
  "ruff",
  "black",
  "pyright"
]

[tool.hatch.envs.default.scripts]
lint = "ruff check ."
format = "black ."
types = "pyright"


[tool.black]
line-length = 100
target-version = ["py310"]

include = '\.pyi?$'
exclude = '/(\.git|\.venv|venv|build|dist|__pycache__)/'

[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N"
]
ignore = [
  "E501"
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

include = ["src"]
exclude = [
  "node_modules",
  "**/__pycache__",
  "build",
  "dist", "**/.*", ".venv"
]

reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportGeneralTypeIssues = true
